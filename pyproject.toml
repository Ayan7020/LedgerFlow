[project]
name = "ledgerflow"
version = "0.1.0"
description = "LedgerFlow is the Khata management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
    "loguru>=0.7.3",
